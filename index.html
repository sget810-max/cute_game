<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>そらのはこにわ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* layout: full-bleed sky canvas, floating island centered, frosted tool tray docked at the bottom */
:root {
  --ink: #6d5a7e;
  --ink-soft: #9a89a8;
  --paper: rgba(255, 251, 248, 0.86);
  --paper-solid: #fffbf8;
  --line: #f0e3ee;
  --pink: #ffe1ec;
  --pink-deep: #f290b3;
  --sky: #fde8f1;
  --font: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'M PLUS Rounded 1c', 'Hiragino Sans', sans-serif;
  color-scheme: light;
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.top {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.top .right { display: flex; gap: 6px; }
.chip {
  font: inherit; font-size: 14px; font-weight: 700; color: var(--ink);
  background: var(--paper); border: 1.5px solid #fff; border-radius: 999px;
  padding: 7px 13px; display: inline-flex; align-items: center; gap: 7px;
  box-shadow: 0 3px 12px rgba(150, 110, 160, 0.14);
  cursor: pointer; touch-action: manipulation;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.chip:active { transform: scale(0.96); }
.chip:focus-visible, .tool:focus-visible { outline: 2.5px solid var(--pink-deep); outline-offset: 2px; }
.chip .num { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.ico { width: 14px; height: 14px; border-radius: 50%; flex: none; background: #ffd36e; box-shadow: 0 0 0 3px rgba(255, 211, 110, 0.35); }
.ico.dusk { background: #ffae8f; box-shadow: 0 0 0 3px rgba(255, 174, 143, 0.35); }
.ico.night { background: transparent; box-shadow: inset -5px -2px 0 0 #f2d77e; transform: rotate(-25deg); }
.ico.rain { background: #a9d3f5; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: none; }
#bookBtn.pulse { animation: pulse 0.9s ease 2; }
@keyframes pulse { 50% { transform: scale(1.12); background: var(--pink); } }

#toast {
  position: fixed; left: 50%; top: calc(62px + env(safe-area-inset-top, 0px));
  transform: translate(-50%, -8px); opacity: 0; max-width: calc(100% - 40px);
  background: var(--paper-solid); color: var(--ink); border-radius: 20px;
  padding: 9px 18px; white-space: pre-line; width: max-content; line-height: 1.55; font-size: 14px; font-weight: 700; text-align: center;
  box-shadow: 0 6px 20px rgba(150, 110, 160, 0.18);
  transition: opacity 0.35s, transform 0.35s; pointer-events: none;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

#hint {
  position: fixed; left: 50%; bottom: calc(108px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); width: max-content; max-width: calc(100% - 40px);
  background: var(--paper-solid); border-radius: 18px; padding: 10px 16px;
  font-size: 13px; line-height: 1.6; text-align: center; font-weight: 500;
  box-shadow: 0 6px 20px rgba(150, 110, 160, 0.16); pointer-events: none;
  animation: float 2.4s ease-in-out infinite;
}
#hint b { color: var(--pink-deep); }
@keyframes float { 50% { transform: translate(-50%, -5px); } }

#tools {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: center; gap: 4px;
  padding: 10px max(10px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: var(--paper); border-radius: 26px 26px 0 0;
  box-shadow: 0 -4px 22px rgba(150, 110, 160, 0.13);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.tool {
  flex: 1 1 0; min-width: 0; max-width: 70px;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 6px 0 5px; border: 0; border-radius: 18px; background: transparent;
  color: var(--ink); font: inherit; font-size: 11px; font-weight: 700;
  cursor: pointer; touch-action: manipulation; transition: transform 0.18s, background 0.18s;
}
.tool canvas { width: 38px; height: 38px; }
.tool[aria-pressed="true"] { background: var(--pink); transform: translateY(-4px); }

#bookWrap { position: fixed; inset: 0; }
#bookWrap .backdrop { position: absolute; inset: 0; background: rgba(110, 90, 130, 0.25); animation: fade 0.25s ease; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 82%;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--paper-solid); border-radius: 26px 26px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  box-shadow: 0 -6px 30px rgba(110, 90, 130, 0.2);
  animation: up 0.3s cubic-bezier(.2, .9, .3, 1.1);
}
.sheet header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.sheet h2 { margin: 0; font-size: 18px; text-wrap: balance; }
.sheet header .num { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; }
.sheet header .chip { margin-left: auto; }
.cards { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 520px) { .cards { grid-template-columns: 1fr 1fr; } }
.card {
  display: flex; gap: 12px; align-items: center; min-width: 0;
  background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 10px 12px;
}
.card canvas { width: 64px; height: 64px; flex: none; border-radius: 14px; background: #fdf3f8; }
.card .txt { min-width: 0; }
.card .name { font-weight: 700; font-size: 15px; }
.card .desc { font-size: 12px; line-height: 1.6; color: var(--ink-soft); margin-top: 2px; }
.card.unknown .name { color: var(--ink-soft); }
.card.here .name::after { content: "いまいる"; margin-left: 8px; font-size: 10px; padding: 2px 7px; border-radius: 999px; background: #dff3e4; color: #5d9a6b; vertical-align: 2px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  #hint, .sheet, #bookWrap .backdrop, #bookBtn.pulse { animation: none; }
}
</style>
</head>
<body>
<canvas id="c" aria-label="浮島の箱庭"></canvas>

<div class="top">
  <button class="chip" id="clock" type="button"><span class="ico" id="clockIco"></span><span id="clockTxt">ひる</span></button>
  <div class="right">
    <button class="chip" id="bookBtn" type="button">ずかん <span class="num" id="bookNum">0/10</span></button>
    <button class="chip" id="soundBtn" type="button">おと オン</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="hint" hidden>下の道具をえらんで、島を<b>タップ</b>してね<br>なぞると続けて置けるよ</div>
<nav id="tools" aria-label="道具"></nav>

<div id="bookWrap" hidden>
  <div class="backdrop" id="bookBg"></div>
  <section class="sheet" role="dialog" aria-label="せいれい図鑑">
    <header>
      <h2>せいれい図鑑</h2><span class="num" id="bookNum2"></span>
      <button class="chip" id="bookClose" type="button">とじる</button>
    </header>
    <div class="cards" id="cards"></div>
  </section>
</div>

<script>
(() => {
'use strict';

// ---------- 基本 ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = "'Zen Maru Gothic','Hiragino Maru Gothic ProN','M PLUS Rounded 1c',sans-serif";
const N = 7, C = 3;
const valid = (i, j) => i >= 0 && j >= 0 && i < N && j < N && (i - C) ** 2 + (j - C) ** 2 <= 10.5;
const TILES = [];
for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (valid(i, j)) TILES.push([i, j]);
TILES.sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]) || a[0] - b[0]);
const idx = (i, j) => i * N + j;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return n >>> 0; }
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const LABEL = { grass: 'くさ', flower: 'おはな', stone: 'いし', water: 'みず', mush: 'きのこ', tree: 'き', erase: 'けす' };
const TOOLS = ['grass', 'flower', 'stone', 'water', 'mush', 'tree', 'erase'];
const BLOCKING = { tree: 1, stone: 1, mush: 1 };

// ---------- セーブ ----------
const KEY = 'sora-hakoniwa-v1';
let grid = new Array(N * N).fill(null);
let seen = {};
let muted = false;
let tool = 'grass';
let hinted = false;
function defaultIsland() {
  const put = (i, j, k, v = 0) => { grid[idx(i, j)] = { k, v }; };
  put(2, 3, 'grass'); put(3, 2, 'grass'); put(4, 4, 'grass', 1); put(3, 4, 'grass');
  put(2, 4, 'flower', 0); put(4, 2, 'flower', 1);
  put(1, 3, 'tree', 0);
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.grid) && d.grid.length === N * N) {
      grid = d.grid; seen = d.seen || {}; muted = !!d.muted; tool = TOOLS.includes(d.tool) ? d.tool : 'grass'; hinted = !!d.hinted;
      return;
    }
  } catch (e) {}
  defaultIsland();
}
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify({ grid: grid.map(c => c && { k: c.k, v: c.v }), seen, muted, tool, hinted })); } catch (e) {}
  }, 250);
}
load();

// ---------- 時間と天気 ----------
const CYCLE = 300000; // 5分でひとめぐり
const dbg = { p: null, rain: null };
window.__hako = { dbg };
const phase = () => dbg.p != null ? dbg.p : (Date.now() % CYCLE) / CYCLE;
function nightAmt(p) { if (p < 0.5) return 0; if (p < 0.6) return smooth((p - 0.5) / 0.1); if (p < 0.9) return 1; return 1 - smooth((p - 0.9) / 0.1); }
const bump = (p, s, e) => (p < s || p > e) ? 0 : Math.sin(Math.PI * (p - s) / (e - s));
const duskAmt = p => Math.max(bump(p, 0.44, 0.64), bump(p, 0.86, 1.0) * 0.8);
function phaseName(p) { if (p < 0.47) return 'day'; if (p < 0.6) return 'dusk'; if (p < 0.9) return 'night'; return 'dawn'; }
function rainTarget() { if (dbg.rain != null) return dbg.rain; return hash(Math.floor(Date.now() / 60000)) % 4 === 0 ? 1 : 0; }
let rainAmt = rainTarget();
let night = 0, dusk = 0, isNight = false, isRain = false;

// ---------- 描画ヘルパー ----------
function ell(g, x, y, rx, ry, fill, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(rx, 0.01), Math.max(ry, 0.01), rot, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); }
function circ(g, x, y, r, fill) { ell(g, x, y, r, r, fill); }
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function heart(g, x, y, s, fill) {
  g.beginPath(); g.moveTo(x, y + s * 0.35);
  g.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  g.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
  g.fillStyle = fill; g.fill();
}
function star4(g, x, y, s, fill) {
  g.beginPath(); g.moveTo(x, y - s); g.quadraticCurveTo(x, y, x + s, y); g.quadraticCurveTo(x, y, x, y + s);
  g.quadraticCurveTo(x, y, x - s, y); g.quadraticCurveTo(x, y, x, y - s); g.fillStyle = fill; g.fill();
}
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const SHADOW = 'rgba(130,100,160,0.16)';

// ---------- アイテム ----------
const FLOWER_COL = ['#ffb3c9', '#cdb8ff', '#ffe08f'];
const VARIANTS = { grass: 2, flower: 3, stone: 2, water: 1, mush: 3, tree: 3 };
function flowerHead(g, x, y, r, col) {
  for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2 - Math.PI / 2; circ(g, x + Math.cos(a) * r, y + Math.sin(a) * r * 0.9, r * 0.82, col); }
  circ(g, x, y, r * 0.62, '#fff6cf');
}
function drawGrass(g, x, y, s, t, seed, v) {
  const tufts = v ? [[-0.16, 0.0], [0.15, -0.03], [0.02, 0.08], [-0.02, -0.08]] : [[-0.17, -0.02], [0.14, -0.04], [0.0, 0.07]];
  g.lineCap = 'round'; g.lineWidth = s * 0.034;
  tufts.forEach(([dx, dy], n) => {
    const bx = x + dx * s, by = y + dy * s, sw = Math.sin(t * 1.6 + seed + n) * 0.05 * s;
    for (let b = -1; b <= 1; b++) {
      g.beginPath(); g.moveTo(bx + b * s * 0.025, by);
      g.quadraticCurveTo(bx + b * s * 0.045, by - s * 0.09, bx + b * s * 0.075 + sw, by - s * (b === 0 ? 0.2 : 0.15));
      g.strokeStyle = b === 0 ? '#7fc98c' : '#a2dba6'; g.stroke();
    }
  });
}
function drawFlower(g, x, y, s, t, seed, v) {
  [[-0.1, 0.03, 1], [0.13, -0.04, 0.78]].forEach(([dx, dy, sc], n) => {
    const bx = x + dx * s, by = y + dy * s, h = s * 0.32 * sc, sw = Math.sin(t * 1.3 + seed * 2 + n) * s * 0.035;
    ell(g, bx, by + s * 0.01, s * 0.06, s * 0.02, SHADOW);
    g.beginPath(); g.moveTo(bx, by); g.quadraticCurveTo(bx, by - h * 0.5, bx + sw, by - h);
    g.strokeStyle = '#8fcf98'; g.lineWidth = s * 0.028; g.lineCap = 'round'; g.stroke();
    ell(g, bx + s * 0.035, by - h * 0.32, s * 0.045, s * 0.018, '#a8ddae', -0.5);
    flowerHead(g, bx + sw, by - h, s * 0.055 * sc, FLOWER_COL[(v + n) % 3]);
  });
}
function drawStone(g, x, y, s, t, seed, v) {
  ell(g, x + s * 0.02, y + s * 0.01, s * 0.21, s * 0.075, SHADOW);
  ell(g, x, y - s * 0.07, s * 0.18, s * 0.125, v ? '#d7cfe6' : '#cfcbe4');
  ell(g, x - s * 0.03, y - s * 0.1, s * 0.12, s * 0.07, v ? '#e7e0f0' : '#e1def1');
  ell(g, x - s * 0.07, y - s * 0.135, s * 0.035, s * 0.018, 'rgba(255,255,255,.85)');
  ell(g, x + s * 0.17, y + s * 0.03, s * 0.06, s * 0.04, '#c6c1dc');
  ell(g, x + s * 0.16, y + s * 0.015, s * 0.03, s * 0.015, '#ddd9ec');
}
function drawWater(g, x, y, s, t, seed) {
  ell(g, x, y, s * 0.35, s * 0.165, '#d4f0fb');
  ell(g, x, y + s * 0.012, s * 0.3, s * 0.135, '#a9ddf5');
  const sh = (Math.sin(t * 1.1 + seed) + 1) / 2;
  ell(g, x - s * 0.1 + sh * s * 0.1, y - s * 0.035, s * 0.07, s * 0.018, 'rgba(255,255,255,.8)');
  ell(g, x + s * 0.12, y + s * 0.05, s * 0.03, s * 0.01, 'rgba(255,255,255,.65)');
}
function drawMush(g, x, y, s, t, seed, v) {
  const COLS = ['#ff9fb6', '#ffbf92', '#c8b4ff'];
  const one = (bx, by, sc, col) => {
    ell(g, bx, by, s * 0.1 * sc, s * 0.03 * sc, SHADOW);
    g.fillStyle = '#fff4e4'; rr(g, bx - s * 0.045 * sc, by - s * 0.17 * sc, s * 0.09 * sc, s * 0.17 * sc, s * 0.04 * sc); g.fill();
    g.beginPath(); g.ellipse(bx, by - s * 0.15 * sc, s * 0.15 * sc, s * 0.13 * sc, 0, Math.PI, 0); g.closePath(); g.fillStyle = col; g.fill();
    circ(g, bx - s * 0.06 * sc, by - s * 0.2 * sc, s * 0.022 * sc, '#fff');
    circ(g, bx + s * 0.035 * sc, by - s * 0.235 * sc, s * 0.018 * sc, '#fff');
    circ(g, bx + s * 0.085 * sc, by - s * 0.18 * sc, s * 0.015 * sc, '#fff');
  };
  one(x + s * 0.11, y - s * 0.03, 0.68, COLS[(v + 1) % 3]);
  one(x - s * 0.05, y + s * 0.03, 1, COLS[v % 3]);
}
function drawTree(g, x, y, s, t, seed, v) {
  ell(g, x, y + s * 0.02, s * 0.24, s * 0.085, SHADOW);
  g.fillStyle = '#dcb393'; rr(g, x - s * 0.045, y - s * 0.42, s * 0.09, s * 0.44, s * 0.04); g.fill();
  const sw = Math.sin(t * 0.9 + seed) * s * 0.015;
  const pal = [['#9fd9ae', '#c1e9c9'], ['#a6dbb0', '#c8edcf'], ['#ffc2d5', '#ffdce7']][v % 3];
  const cx = x + sw, cy = y - s * 0.56;
  circ(g, cx - s * 0.15, cy + s * 0.06, s * 0.16, pal[0]); circ(g, cx + s * 0.15, cy + s * 0.06, s * 0.16, pal[0]);
  circ(g, cx, cy - s * 0.07, s * 0.2, pal[0]);
  circ(g, cx - s * 0.06, cy - s * 0.12, s * 0.11, pal[1]); circ(g, cx + s * 0.1, cy, s * 0.08, pal[1]);
  if (v === 1) [[-0.13, 0.09], [0.07, -0.1], [0.17, 0.1], [-0.02, 0.05]].forEach(([a, b]) => circ(g, cx + a * s, cy + b * s, s * 0.032, '#ffb592'));
  if (v === 2) [[-0.14, 0.02], [0.05, -0.14], [0.15, 0.06], [-0.04, 0.1], [0.0, -0.02]].forEach(([a, b]) => circ(g, cx + a * s, cy + b * s, s * 0.02, '#fff'));
}
const DRAW = { grass: drawGrass, flower: drawFlower, stone: drawStone, water: drawWater, mush: drawMush, tree: drawTree };
function drawEraser(g, x, y, s) {
  g.save(); g.translate(x, y); g.rotate(-0.5);
  g.fillStyle = '#ffc6d8'; rr(g, -s * 0.28, -s * 0.13, s * 0.56, s * 0.26, s * 0.07); g.fill();
  g.fillStyle = '#b9d9f7'; rr(g, s * 0.06, -s * 0.13, s * 0.22, s * 0.26, s * 0.05); g.fill();
  g.fillStyle = 'rgba(255,255,255,.6)'; rr(g, -s * 0.22, -s * 0.09, s * 0.22, s * 0.05, s * 0.025); g.fill();
  g.restore();
}

// ---------- せいれい ----------
const SPIRITS = [
  { id: 'moko', name: 'もこ', col: '#bfe7b5', acc: 'sprout', fav: 'grass',
    cond: c => c.grass >= 3, hint: '草がたくさんある場所が好きみたい',
    desc: '草のにおいが大好きな、もふもふの精霊。ねころがるのが得意。', lines: ['もふもふ…', '草のにおい、すき', 'ころころ〜'] },
  { id: 'powa', name: 'ぽわ', col: '#ffd3df', acc: 'flower', fav: 'flower',
    cond: c => c.flower >= 3, hint: 'お花がいっぱい咲いていると…',
    desc: '花びらから生まれた精霊。そばにいると、ほんのりいい香り。', lines: ['ぽわ〜', 'お花、きれいだね', 'ふふっ'] },

  g.beginPath(); g.arc(ex + r * 0.07, -r * 0.72, r * 0.07, 0.1 * Math.PI, 0.9 * Math.PI); g.stroke();
  // かざり

// ---------- レイアウト ----------

let stars = [], clouds = [], islets = [], flies = [];

}
function drawSky() {
  const day = [hex('#bfe4ff'), hex('#ffeef6')], du = [hex('#ffc0d6'), hex('#ffe4bd')], ni = [hex('#4c4e8e'), hex('#a698d4')], ra = [hex('#c8cde3'), hex('#ebe6f1')];
  let top = mixc(day[0], du[0], dusk), bot = mixc(day[1], du[1], dusk);
  top = mixc(top, ni[0], night); bot = mixc(bot, ni[1], night);
  top = mixc(top, ra[0], rainAmt * 0.55 * (1 - night * 0.6)); bot = mixc(bot, ra[1], rainAmt * 0.45 * (1 - night * 0.6));
  const gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, rgb(top)); gr.addColorStop(1, rgb(bot));
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  if (night > 0.01) for (const s of stars) { ctx.globalAlpha = night * (0.5 + 0.5 * Math.sin(T * 1.5 + s.p)) * (1 - rainAmt * 0.7); circ(ctx, s.x, s.y, s.r, '#fffbe6'); }
  ctx.globalAlpha = 1;
  const sx = W * 0.83, sy = H * 0.15;
  const sunA = (1 - night) * (1 - rainAmt * 0.75);
  if (sunA > 0.01) {
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, 70);
    g.addColorStop(0, `rgba(255,246,200,${0.9 * sunA})`); g.addColorStop(1, 'rgba(255,246,200,0)');
    ctx.fillStyle = g; ctx.fillRect(sx - 70, sy - 70, 140, 140);
    ctx.globalAlpha = sunA; circ(ctx, sx, sy, 22, dusk > 0.3 ? '#ffd2a8' : '#fff1b8'); ctx.globalAlpha = 1;
  }
  if (night > 0.01) {
    ctx.globalAlpha = night * (1 - rainAmt * 0.6);
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, 60);
    g.addColorStop(0, 'rgba(255,245,200,.45)'); g.addColorStop(1, 'rgba(255,245,200,0)');
    ctx.fillStyle = g; ctx.fillRect(sx - 60, sy - 60, 120, 120);
    const R = 18, dd = 10, hy = Math.sqrt(R * R - dd * dd / 4), th = Math.atan2(hy, dd / 2);
    ctx.beginPath(); ctx.arc(sx, sy, R, th, -th, false); ctx.arc(sx + dd, sy, R, Math.atan2(-hy, -dd / 2), Math.atan2(hy, -dd / 2), true);
    ctx.closePath(); ctx.fillStyle = '#fff2c4'; ctx.fill(); ctx.globalAlpha = 1;

}
function drawClouds(dt) {
  const a = 0.85 - night * 0.6 + rainAmt * 0.1;
  for (const c of clouds) {
    c.x += c.v * dt * (reduceMotion ? 0.2 : 1);
    const w = 90 * c.s;
    if (c.x - w > W) c.x = -w;
    ctx.globalAlpha = a;
    const col = night > 0.5 ? '#c9c2ea' : (rainAmt > 0.5 ? '#f1eef7' : '#ffffff');
    ell(ctx, c.x, c.y, w * 0.55, 14 * c.s, col);
    circ(ctx, c.x - w * 0.22, c.y - 8 * c.s, 18 * c.s, col);
    circ(ctx, c.x + w * 0.08, c.y - 14 * c.s, 24 * c.s, col);
    circ(ctx, c.x + w * 0.32, c.y - 4 * c.s, 15 * c.s, col);

}
function drawIslet(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x - s, y); ctx.quadraticCurveTo(x - s * 0.5, y + s * 1.1, x, y + s * 1.4); ctx.quadraticCurveTo(x + s * 0.5, y + s * 1.1, x + s, y); ctx.closePath();

// ---------- 島 ----------
const iso = (fi, fj) => [cx + (fi - fj) * TW / 2, cy + (fi + fj - 6) * TH / 2];
function pickTile(x, y) {
  const a = (x - cx) / (TW / 2), b = (y - cy) / (TH / 2) + 6;
  const i = Math.round((a + b) / 2), j = Math.round((b - a) / 2);
  return valid(i, j) ? [i, j] : null;
}
const TOP_COL = ['#cdeec8', '#c7ebc2', '#d3f0ce'];
function face(a, b, col) {
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(b[0], b[1] + DEP); ctx.lineTo(a[0], a[1] + DEP); ctx.closePath();
  ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(b[0], b[1] + DEP * 0.22); ctx.lineTo(a[0], a[1] + DEP * 0.22); ctx.closePath();
  ctx.fillStyle = '#a9dba5'; ctx.fill();
}
function drawUnderside() {
  const bx = cx, top = cy + TH * 0.3, bottom = cy + TH * 2.5 + DEP + TW * 1.15;
  const g = ctx.createLinearGradient(0, top, 0, bottom);
  g.addColorStop(0, '#e7bf9d'); g.addColorStop(1, '#e3c3e3');
  ctx.beginPath(); ctx.moveTo(bx - TW * 2.35, top);
  ctx.bezierCurveTo(bx - TW * 2.1, top + TW * 1.5, bx - TW * 0.9, bottom - TW * 0.25, bx, bottom);
  ctx.bezierCurveTo(bx + TW * 0.9, bottom - TW * 0.25, bx + TW * 2.1, top + TW * 1.5, bx + TW * 2.35, top);
  ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  // つる
  ctx.lineCap = 'round'; ctx.lineWidth = TW * 0.035; ctx.strokeStyle = '#9fd3a0';
  for (const [dx, len, ph] of [[-1.3, 0.7, 0], [0.9, 0.9, 1.5], [-0.3, 0.5, 3]]) {
    const x0 = bx + dx * TW, y0 = top + TW * (1.3 - Math.abs(dx) * 0.35) + TW * 0.25;
    const sw = Math.sin(T * 0.8 + ph) * TW * 0.06;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(x0 + sw, y0 + len * TW * 0.5, x0 + sw * 1.5, y0 + len * TW);
    ctx.stroke();
    ell(ctx, x0 + sw * 1.5 + TW * 0.04, y0 + len * TW, TW * 0.06, TW * 0.03, '#b5e2b4', 0.6);
  }
  ell(ctx, bx + TW * 0.35, bottom - TW * 0.55, TW * 0.09, TW * 0.06, '#d8b8d8');
  ell(ctx, bx - TW * 0.5, bottom - TW * 0.75, TW * 0.06, TW * 0.04, '#f0d4c0');
}
let hl = null; // 押したタイルの光
function drawIsland() {
  drawUnderside();
  const hw = TW / 2, hh = TH / 2;
  for (const [i, j] of TILES) {
    const [x, y] = iso(i, j);
    if (!valid(i + 1, j)) face([x + hw, y], [x, y + hh], '#ecc4a1');
    if (!valid(i, j + 1)) face([x - hw, y], [x, y + hh], '#f5d6b8');
    ctx.beginPath(); ctx.moveTo(x, y - hh); ctx.lineTo(x + hw, y); ctx.lineTo(x, y + hh); ctx.lineTo(x - hw, y); ctx.closePath();
    const col = TOP_COL[hash(i * 7 + j * 13) % 3];
    ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.32)'; ctx.lineWidth = 1; ctx.stroke();
    const c = grid[idx(i, j)];
    if (c && c.k === 'water') {
      drawWater(ctx, x, y, TW, T, i * 3 + j);
      if (rainAmt > 0.3 && Math.random() < 0.02 * rainAmt) parts.push({ kind: 'ripple', x: x + rand(-0.15, 0.15) * TW, y: y + rand(-0.05, 0.05) * TW, life: 0, max: 0.9 });
    }
  }
  if (hl) {
    const a = 1 - (T - hl.t) / 0.45;
    if (a <= 0) hl = null;
    else {
      const [x, y] = iso(hl.i, hl.j);
      ctx.beginPath(); ctx.moveTo(x, y - hh); ctx.lineTo(x + hw, y); ctx.lineTo(x, y + hh); ctx.lineTo(x - hw, y); ctx.closePath();
      ctx.fillStyle = `rgba(255,255,255,${0.45 * a})`; ctx.fill();
    }
  }
}

// ---------- 精霊のうごき ----------
const residents = new Map();
const pending = {}, absent = {};
let firstTick = true;
function counts() {
  const c = { grass: 0, flower: 0, stone: 0, water: 0, mush: 0, tree: 0 };
  for (const g of grid) if (g) c[g.k]++;
  return c;
}
function tilesWith(k) { return TILES.filter(([i, j]) => { const c = grid[idx(i, j)]; return k ? c && c.k === k : true; }); }
function pickSpot(fav) {
  let list = fav ? tilesWith(fav) : [];
  if (!list.length || Math.random() < 0.35) list = TILES.filter(([i, j]) => { const c = grid[idx(i, j)]; return !c || !BLOCKING[c.k]; });
  if (!list.length) list = TILES;
  const [i, j] = pick(list);
  return [i + rand(-0.22, 0.22), j + rand(-0.22, 0.22)];
}
function arrive(d, quiet) {

    const b = document.getElementById('bookBtn'); b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
  } else toast(`${d.name}が遊びにきたよ`);

  const msg = s.d.nocturnal ? `${s.d.name}は夜空へかえっていった` : s.d.weather ? `${s.d.name}は雨といっしょに旅立った` : `${s.d.name}はおさんぽに出かけた`;

function tickSpirits() {

      if (s && s.state === 'leaving') { s.state = 'idle'; s.alpha = 1; s.timer = 1; continue; }
      if (s) continue;
      if (firstTick && seen[d.id]) { arrive(d, true); continue; }
      if (!pending[d.id]) {
        pending[d.id] = T + rand(2.5, 6);
        if (!seen[d.id]) toast('なにかの気配がする…');
      } else if (T >= pending[d.id]) { delete pending[d.id]; arrive(d, false); }
    } else {
      delete pending[d.id];
      if (s && s.state !== 'leaving') {
        if (absent[d.id] == null) absent[d.id] = T;
        if (T - absent[d.id] > (d.weather ? 2 : 8)) leave(s);
      }
    }
  }
  firstTick = false;
}
function chooseNext(s) {
  const r = Math.random();
  const sleepP = isNight && !s.d.nocturnal ? 0.45 : 0.1;
  if (r < sleepP && !s.d.float) { s.state = 'sleep'; s.timer = rand(6, 12); s.zAt = T + 0.5; }
  else if (r < sleepP + 0.2) { s.state = 'play'; s.timer = rand(1.5, 3); }
  else { const [a, b] = pickSpot(s.d.fav); s.tx = a; s.tj = b; s.state = 'walk'; }
}
function updateSpirits(dt) {
  const r = TW * 0.17;
  for (const [id, s] of residents) {
    if (s.state === 'arrive') {
      const k = (T - s.t0) / 0.9; s.alpha = clamp(k, 0, 1);
      if (k >= 1) { s.state = 'idle'; s.timer = rand(1, 2.5); s.sq = 0.18; }
    } else if (s.state === 'idle') {
      s.timer -= dt; if (s.timer <= 0) chooseNext(s);
    } else if (s.state === 'walk') {
      const dx = s.tx - s.fi, dy = s.tj - s.fj, dist = Math.hypot(dx, dy);
      const sp = 0.75 * dt;
      if (dist < sp) { s.fi = s.tx; s.fj = s.tj; s.state = 'idle'; s.timer = rand(2, 5); }
      else { s.fi += dx / dist * sp; s.fj += dy / dist * sp; s.look = clamp((dx - dy) / dist, -1, 1); s.walk += dt * 9; }
    } else if (s.state === 'sleep') {
      s.timer -= dt;
      if (T > s.zAt) { s.zAt = T + 1.3; const [x, y] = iso(s.fi, s.fj); parts.push({ kind: 'z', x: x + r * 0.6, y: y - r * 2, vx: 6, vy: -14, life: 0, max: 2, size: r * 0.6 }); }
      if (s.timer <= 0) { s.state = 'idle'; s.timer = rand(1, 3); }
    } else if (s.state === 'play') {
      s.timer -= dt;
      if (s.jz === 0 && s.vz === 0 && Math.random() < dt * 2.5) s.vz = rand(5, 8);
      if (s.timer <= 0) { s.state = 'idle'; s.timer = rand(1, 3); }
    } else if (s.state === 'leaving') {
      const k = (T - s.t0) / 1.2; s.alpha = 1 - k;
      if (k >= 1) residents.delete(id);
    }
    if (s.vz !== 0 || s.jz > 0) {
      s.vz -= 38 * dt; s.jz += s.vz * dt;
      if (s.jz <= 0) { s.jz = 0; s.vz = 0; s.sq = 0.16; }
    }
    s.sq *= Math.pow(0.002, dt);
    if (T > s.blinkAt) { s.blinkUntil = T + 0.13; s.blinkAt = T + rand(2, 5); }
  }
}
function spiritScreen(s) {
  const r = TW * 0.17;
  const [x, y] = iso(s.fi, s.fj);
  let lift = s.jz * r;
  if (s.state === 'walk') lift += Math.abs(Math.sin(s.walk)) * r * 0.28;
  if (s.d.float) lift += r * 0.55 + Math.sin(T * 2 + s.fi) * r * 0.15;
  if (s.state === 'arrive') lift += (1 - smooth((T - s.t0) / 0.9)) * r * 3;
  if (s.state === 'leaving') lift += smooth((T - s.t0) / 1.2) * r * 3;
  return { x, y, lift, r };
}
function drawSpiritInWorld(s) {
  const { x, y, lift, r } = spiritScreen(s);
  ctx.globalAlpha = s.alpha;
  ell(ctx, x, y, r * 0.85 * (1 - Math.min(lift / (r * 6), 0.5)), r * 0.26, SHADOW);
  ctx.globalAlpha = 1;
  const walkSq = s.state === 'walk' ? Math.sin(s.walk * 2) * 0.05 : 0;
  const breathe = s.state === 'sleep' ? Math.sin(T * 2) * 0.04 : Math.sin(T * 2.4 + s.fi) * 0.02;
  drawSpirit(ctx, s.d, x, y - lift, r, {
    t: T, alpha: s.alpha, sq: s.sq + walkSq + breathe, look: s.look,
    sleep: s.state === 'sleep', blink: T < (s.blinkUntil || 0), happy: T < s.happyUntil,
  });
}
function pet(s) {
  const { x, y, lift, r } = spiritScreen(s);
  let line;
  if (s.state === 'sleep') { s.state = 'idle'; s.timer = rand(1.5, 3); line = 'ふぁ…おはよ'; }
  else line = pick(s.d.lines);
  if (s.state !== 'leaving' && s.state !== 'arrive') { s.vz = 8; if (s.state === 'walk') { s.state = 'idle'; s.timer = 1.5; } }
  s.happyUntil = T + 1.2;
  s.bubble = { text: line, until: T + 2.6 };
  for (let k = 0; k < 3; k++) parts.push({ kind: 'heart', x: x + rand(-r, r), y: y - lift - r * 2, vx: rand(-12, 12), vy: rand(-45, -30), life: 0, max: 1.3, size: r * rand(0.28, 0.4) });
  tone(PENTA[5], 0, 0.25, 0.09); tone(PENTA[7], 0.09, 0.35, 0.08);
}
function drawBubble(s) {
  if (!s.bubble || T > s.bubble.until) { s.bubble = null; return; }
  const { x, y, lift, r } = spiritScreen(s);
  const fs = Math.max(13, r * 0.75);
  ctx.font = `700 ${fs}px ${FONT}`;
  const w = ctx.measureText(s.bubble.text).width + fs * 1.3, h = fs * 1.9;
  const a = Math.min(1, (s.bubble.until - T) / 0.3);
  let bx = clamp(x - w / 2, 8, W - w - 8);
  const by = y - lift - r * 2.6 - h;
  ctx.globalAlpha = a;
  ctx.fillStyle = '#fffdfb'; rr(ctx, bx, by, w, h, h / 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 6, by + h - 1); ctx.lineTo(x + 6, by + h - 1); ctx.lineTo(x, by + h + 7); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#6d5a7e'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(s.bubble.text, bx + w / 2, by + h / 2 + 1);
  ctx.globalAlpha = 1;
}

// ---------- パーティクル ----------
let parts = [];
function burst(x, y, kind, n, cols) {
  for (let k = 0; k < n; k++) {
    const a = rand(0, Math.PI * 2), v = rand(30, 90);
    parts.push({ kind, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, g: 90, life: 0, max: rand(0.6, 1.1), col: pick(cols), size: rand(3, 6) });
  }
}
function drawParts(dt) {
  parts = parts.filter(p => (p.life += dt) < p.max);
  for (const p of parts) {
    p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt; p.vy = (p.vy || 0) + (p.g || 0) * dt;
    const a = 1 - p.life / p.max;
    ctx.globalAlpha = a;
    if (p.kind === 'spark') star4(ctx, p.x, p.y, p.size * (0.6 + a * 0.6), p.col);
    else if (p.kind === 'dot') circ(ctx, p.x, p.y, p.size * a, p.col);
    else if (p.kind === 'heart') heart(ctx, p.x, p.y, p.size, '#ff9fbf');
    else if (p.kind === 'z') { ctx.fillStyle = night > 0.5 ? '#f3eaff' : '#9a89a8'; ctx.font = `700 ${p.size}px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('z', p.x, p.y); }
    else if (p.kind === 'ripple') { ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(p.x, p.y, TW * 0.08 * (1.5 - a), TW * 0.035 * (1.5 - a), 0, 0, Math.PI * 2); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
}
let drops = [];
function drawRain(dt) {
  const want = Math.round(90 * rainAmt);
  while (drops.length < want) drops.push({ x: rand(-50, W + 50), y: rand(-H, H), v: rand(380, 520), l: rand(10, 18) });
  if (drops.length > want) drops.length = want;
  ctx.strokeStyle = night > 0.5 ? 'rgba(220,215,255,.45)' : 'rgba(150,180,230,.5)'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const d of drops) {
    d.y += d.v * dt; d.x -= d.v * 0.15 * dt;
    if (d.y > H) { d.y = rand(-60, -10); d.x = rand(-20, W + 80); }
    ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.l * 0.15, d.y - d.l);
  }
  ctx.stroke();
}
function drawGlow() {
  ctx.globalCompositeOperation = 'lighter';
  for (const s of residents.values()) {
    if (!s.d.glow) continue;
    const { x, y, lift, r } = spiritScreen(s);
    const a = (0.25 + night * 0.35) * s.alpha * (0.75 + 0.25 * Math.sin(T * (s.d.id === 'potto' ? 5 : 2)));
    const g = ctx.createRadialGradient(x, y - lift - r * 0.9, 0, x, y - lift - r * 0.9, r * 2.6);
    g.addColorStop(0, `rgba(${s.d.glow},${a})`); g.addColorStop(1, `rgba(${s.d.glow},0)`);
    ctx.fillStyle = g; ctx.fillRect(x - r * 3, y - lift - r * 4, r * 6, r * 6);
  }
  if (night > 0.05) {
    for (const f of flies) {
      f.a += f.sp * 0.016;
      const x = cx + Math.cos(f.a) * f.rx * TW, y = cy + f.ry * TW + Math.sin(f.a * 1.7 + f.p) * TW * 0.3 - TW * 0.3;
      const a = night * Math.max(0, Math.sin(T * 1.8 + f.p)) * 0.9;
      const g = ctx.createRadialGradient(x, y, 0, x, y, 9);
      g.addColorStop(0, `rgba(255,245,170,${a})`); g.addColorStop(1, 'rgba(255,245,170,0)');
      ctx.fillStyle = g; ctx.fillRect(x - 9, y - 9, 18, 18);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ---------- おと ----------
const PENTA = [392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5];
let ac = null, master = null, rainGain = null, chimeAt = 0;
function ensureAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(ac.destination);
    const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), ch = buf.getChannelData(0);
    for (let k = 0; k < ch.length; k++) ch[k] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    rainGain = ac.createGain(); rainGain.gain.value = 0;
    src.connect(lp); lp.connect(rainGain); rainGain.connect(master); src.start();
  } catch (e) { ac = null; }
}
function tone(f, when = 0, dur = 0.5, vol = 0.1, type = 'sine') {
  if (!ac || muted) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function arpeggio() { [0, 2, 4, 7].forEach((n, k) => tone(PENTA[n], k * 0.11, 0.6, 0.08)); }
function ambient() {
  if (!ac || muted) return;
  if (T > chimeAt) {
    chimeAt = T + rand(3, 6);
    const f = pick(PENTA) * (isNight ? 0.5 : 1);
    tone(f, 0, 1.6, 0.025); tone(f * 2, 0.02, 0.9, 0.008, 'triangle');
  }
}

// ---------- 操作 ----------
let dragging = false, lastTile = null;
function worldPoint(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top - bob]; }
function hitSpirit(x, y) {
  const list = [...residents.values()].filter(s => s.state !== 'leaving').map(s => ({ s, p: spiritScreen(s) })).sort((a, b) => b.p.y - a.p.y);
  for (const { s, p } of list) if (Math.hypot(x - p.x, y - (p.y - p.lift - p.r * 0.9)) < Math.max(p.r * 1.5, 22)) return s;
  return null;
}
function paintAt(x, y) {
  const t = pickTile(x, y);
  if (!t) return;
  const key = t[0] * 100 + t[1];
  if (key === lastTile) return;
  lastTile = key;
  const [i, j] = t, k = idx(i, j), cur = grid[k];
  const [px, py] = iso(i, j);
  if (tool === 'erase') {
    if (!cur) return;
    grid[k] = null;
    burst(px, py - TW * 0.1, 'dot', 8, ['#e9dcef', '#d8ecd6', '#f6e1d0']);
    tone(PENTA[0] * 0.5, 0, 0.3, 0.08, 'triangle');
  } else {
    if (cur && cur.k === tool) return;
    grid[k] = { k: tool, v: (Math.random() * VARIANTS[tool]) | 0, born: T };
    const cols = { grass: ['#bfe7b5', '#a6dcab'], flower: ['#ffc6d8', '#e0d2ff', '#ffe8a8'], stone: ['#e3e0f0'], water: ['#c8ecfb', '#fff'], mush: ['#ffc9d5', '#fff4e4'], tree: ['#bfe7c8', '#ffd9e5'] }[tool];
    burst(px, py - TW * 0.1, 'dot', 7, cols);
    const base = { stone: 0, water: 2, grass: 3, flower: 4, mush: 1, tree: 2 }[tool];
    tone(PENTA[(base + (i + j) % 4) % 8], 0, 0.45, 0.09); tone(PENTA[(base + (i + j) % 4) % 8] * 2, 0, 0.2, 0.02, 'triangle');
  }
  hl = { i, j, t: T };
  if (!hinted) { hinted = true; document.getElementById('hint').hidden = true; }
  save();
}
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  const [x, y] = worldPoint(e);
  const s = hitSpirit(x, y);
  if (s) { pet(s); return; }
  dragging = true; lastTile = null;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  paintAt(x, y);
});
cv.addEventListener('pointermove', e => { if (dragging) { const [x, y] = worldPoint(e); paintAt(x, y); } });
const stop = () => { dragging = false; lastTile = null; };
cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);

// ---------- UI ----------
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}
function buildTools() {
  toolsEl.innerHTML = '';
  for (const k of TOOLS) {
    const b = document.createElement('button');
    b.className = 'tool'; b.type = 'button'; b.dataset.k = k; b.setAttribute('aria-pressed', k === tool);
    const c = document.createElement('canvas'); c.width = 76; c.height = 76;
    const g = c.getContext('2d'); g.scale(2, 2);
    if (k === 'erase') drawEraser(g, 19, 20, 34);
    else if (k === 'water') drawWater(g, 19, 23, 50, 0.6, 0);
    else if (k === 'tree') drawTree(g, 19, 35, 44, 0, 0, 0);
    else if (k === 'stone') drawStone(g, 19, 28, 70, 0, 0, 0);
    else if (k === 'mush') drawMush(g, 19, 31, 72, 0, 0, 0);
    else DRAW[k](g, 19, k === 'flower' ? 32 : 30, 72, 0, 0, 0);
    const l = document.createElement('span'); l.textContent = LABEL[k];
    b.append(c, l);
    b.addEventListener('click', () => {
      ensureAudio();
      tool = k; save();
      toolsEl.querySelectorAll('.tool').forEach(x => x.setAttribute('aria-pressed', x.dataset.k === k));
      tone(PENTA[TOOLS.indexOf(k) % 8], 0, 0.18, 0.05);
    });
    toolsEl.append(b);
  }
}
function updateBookNum() {
  const n = SPIRITS.filter(d => seen[d.id]).length;
  document.getElementById('bookNum').textContent = `${n}/${SPIRITS.length}`;
  document.getElementById('bookNum2').textContent = `${n} / ${SPIRITS.length} 種`;
}
const bookWrap = document.getElementById('bookWrap');
function openBook() {
  ensureAudio();
  const cards = document.getElementById('cards'); cards.innerHTML = '';
  for (const d of SPIRITS) {
    const known = !!seen[d.id];
    const el = document.createElement('div');
    el.className = 'card' + (known ? '' : ' unknown') + (residents.has(d.id) && residents.get(d.id).state !== 'leaving' ? ' here' : '');
    const c = document.createElement('canvas'); c.width = 128; c.height = 128;
    const g = c.getContext('2d'); g.scale(2, 2);
    if (d.glow && known) { const gr = g.createRadialGradient(32, 38, 0, 32, 38, 30); gr.addColorStop(0, `rgba(${d.glow},.8)`); gr.addColorStop(1, `rgba(${d.glow},0)`); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); }
    ell(g, 32, 54, 14, 4, SHADOW);
    drawSpirit(g, d, 32, 54 - (d.float ? 3 : 0), 15, { t: 0.5, sil: !known });
    const tx = document.createElement('div'); tx.className = 'txt';
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = known ? d.name : '？？？';
    const ds = document.createElement('div'); ds.className = 'desc'; ds.textContent = known ? d.desc : `ヒント：${d.hint}`;
    tx.append(nm, ds); el.append(c, tx); cards.append(el);
  }
  updateBookNum();
  bookWrap.hidden = false;
}
document.getElementById('bookBtn').addEventListener('click', openBook);
document.getElementById('bookClose').addEventListener('click', () => { bookWrap.hidden = true; });
document.getElementById('bookBg').addEventListener('click', () => { bookWrap.hidden = true; });
const soundBtn = document.getElementById('soundBtn');
function updateSoundBtn() { soundBtn.textContent = muted ? 'おと オフ' : 'おと オン'; soundBtn.setAttribute('aria-pressed', !muted); }
soundBtn.addEventListener('click', () => {
  muted = !muted; ensureAudio();
  if (master) master.gain.setTargetAtTime(muted ? 0 : 0.9, ac.currentTime, 0.1);
  updateSoundBtn(); save();
  if (!muted) tone(PENTA[4], 0, 0.3, 0.08);
});
const NAMES = { day: 'ひる', dusk: 'ゆうがた', night: 'よる', dawn: 'あさ' };
document.getElementById('clock').addEventListener('click', () => {
  const p = phase(), marks = [[0.47, 'ゆうがた'], [0.6, 'よる'], [0.9, 'あさ'], [1.0, 'ひる']];
  const [m, name] = marks.find(([q]) => p < q);
  const sec = Math.round((m - p) * CYCLE / 1000);
  toast(`${name}まで あと ${sec >= 60 ? Math.floor(sec / 60) + '分' : ''}${sec % 60}秒`);
});
let lastClock = '';
function updateClock() {
  const pn = phaseName(phase());
  const key = pn + (isRain ? 'r' : '');
  if (key === lastClock) return; lastClock = key;
  document.getElementById('clockIco').className = 'ico ' + (isRain ? 'rain' : pn === 'dawn' ? 'dusk' : pn);
  document.getElementById('clockTxt').textContent = NAMES[pn] + (isRain ? '・あめ' : '');
}
document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden) ac.suspend(); else ac.resume();
});

// ---------- ループ ----------
let T = 0, last = performance.now(), bob = 0, tickAt = 0, audioAt = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  const p = phase();
  night = nightAmt(p); dusk = duskAmt(p) * (1 - night * 0.5);
  isNight = p >= 0.58 && p < 0.92;
  rainAmt += (rainTarget() - rainAmt) * Math.min(1, dt * 0.6);
  isRain = rainAmt > 0.5;
  if (T > tickAt) { tickAt = T + 0.5; tickSpirits(); updateClock(); }
  if (ac && rainGain && T > audioAt) { audioAt = T + 0.5; rainGain.gain.setTargetAtTime(muted ? 0 : rainAmt * 0.05, ac.currentTime, 0.6); }
  ambient();
  updateSpirits(dt);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawSky();
  drawClouds(dt);
  islets.forEach(s => drawIslet(s.x, s.y + Math.sin(T * 0.7 + s.p) * (reduceMotion ? 1 : 5), s.s));
  bob = Math.sin(T * 0.8) * (reduceMotion ? 1 : 4);
  ctx.save(); ctx.translate(0, bob);
  drawIsland();
  const items = [];
  for (const [i, j] of TILES) {
    const c = grid[idx(i, j)];
    if (!c || c.k === 'water') continue;
    const [x, y] = iso(i, j);
    items.push({ y, f: () => {
      const age = c.born != null ? T - c.born : 9;
      if (age < 0.4) {
        const k = age / 0.4, sc = 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2);
        ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.translate(-x, -y);
        DRAW[c.k](ctx, x, y, TW, T, i * 3 + j, c.v); ctx.restore();
      } else DRAW[c.k](ctx, x, y, TW, T, i * 3 + j, c.v);
    } });
  }
  for (const s of residents.values()) { const p2 = spiritScreen(s); items.push({ y: p2.y + 0.01, f: () => drawSpiritInWorld(s) }); }
  items.sort((a, b) => a.y - b.y).forEach(it => it.f());
  ctx.restore();

  const tint = night * 0.3 + rainAmt * 0.06;
  if (tint > 0.005) { ctx.fillStyle = `rgba(70,60,140,${tint})`; ctx.fillRect(0, 0, W, H); }
  if (dusk > 0.01) { ctx.fillStyle = `rgba(255,170,150,${dusk * 0.08})`; ctx.fillRect(0, 0, W, H); }

  ctx.save(); ctx.translate(0, bob);
  drawGlow();
  drawParts(dt);
  for (const s of residents.values()) drawBubble(s);
  ctx.restore();
  if (rainAmt > 0.02) drawRain(dt);
  requestAnimationFrame(frame);
}

buildTools();
updateBookNum();
updateSoundBtn();
document.getElementById('hint').hidden = hinted;
layout();
addEventListener('resize', layout);
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
